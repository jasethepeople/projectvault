[package]
name = "projectvault"
version = "1.0.0"
description = "Universal AI Project Exporter"
authors = ["ProjectVault Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/projectvault"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = ["dialog-save", "dialog-open", "fs-write-file", "fs-create-dir", "shell-open", "http-request"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
zip = "0.6"
walkdir = "2.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]